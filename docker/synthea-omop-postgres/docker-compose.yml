version: '3.8'

services:
  synthea-omop-postgres:
    image: postgres:16-alpine
    container_name: taxis-synthea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synthea
      POSTGRES_USER: ohdsi_app
      POSTGRES_PASSWORD: ohdsi_app_pass_2026
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./init_scripts:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohdsi_app -d synthea"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
